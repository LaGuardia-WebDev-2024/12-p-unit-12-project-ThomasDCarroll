<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="title">
        <h1 id="quizabout">Quiz About</h1>
        <img src="WB_CollectionLogo_ThePitt-mobile.webp" height="400" id="logo">
    </div>
    <h2>(This show is taking over my life omg)</h2>
    <hr />

    <!-- Movie Question -->
    <form id="robby-form">
      <label>
        What is this character's name?
        <select id="robby-answer">
          <option value="robby1">Noah</option>
          <option value="robby2">Robby</option>
          <option value="robby3">Robert</option>
          <option value="robby4">Eugene</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
      <img src="01 - DR. ROBINAVITCH.avif" width="500px" class="characterimg">
    <div id="robby-result">
      <p id="robby-text"></p>
    </div>
    <hr />

    <!-- Dana Question -->
    <form id="robby-form">
      <label>
        What is this character's name? (Right)
        <select id="robby-answer">
          <option value="robby1">Miranda</option>
          <option value="robby2">Darlene</option>
          <option value="robby3">Dana</option>
          <option value="robby4">Elizabeth</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
      <img src="07 - DANA EVANS.avif" width="500px" class="characterimg">
    <div id="robby-result">
      <p id="robby-text"></p>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie1") {
          $("#movie-text").text("YESSSS!");
        } 
        else {
          $("#movie-text").text("Try Again!");
        }
      });

      //=======================Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book1") {
          $("#book-text").text("YESSSS!");
        } 
        else {
          $("#book-text").text("Try Again!");
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
